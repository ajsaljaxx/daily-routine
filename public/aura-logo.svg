<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Dark Navy Gradient for the left/main body of the A -->
    <linearGradient id="auraAGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02000D" />
      <stop offset="60%" stop-color="#07203F" />
      <stop offset="100%" stop-color="#12325A" />
    </linearGradient>

    <!-- Warm Tan Gradient for the Horizon Arch -->
    <linearGradient id="auraArchGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EBDED4" />
      <stop offset="50%" stop-color="#D9AA90" />
      <stop offset="100%" stop-color="#EBDED4" />
    </linearGradient>
  </defs>

  <!-- Clean Pure White Background -->
  <rect width="512" height="512" fill="#FFFFFF" />

  <!-- Logo Group Centered -->
  <g transform="translate(0, 10)">
    <!-- Main Chevron "A" Shape -->
    <path d="M 256 100
             C 264 100, 270 105, 276 116
             L 366 350
             C 370 360, 364 370, 352 370
             L 310 370
             C 301 370, 294 365, 290 355
             L 256 265
             L 222 355
             C 218 365, 211 370, 202 370
             L 160 370
             C 148 370, 142 360, 146 350
             L 236 116
             C 242 105, 248 100, 256 100 Z"
          fill="url(#auraAGrad)" />

    <!-- Four-Pointed Diamond Star -->
    <path d="M 256 194
             Q 256 218 238 218
             Q 256 218 256 242
             Q 256 218 274 218
             Q 256 218 256 194 Z"
          fill="#A65E46" />

    <!-- Smooth Horizon Arch Underneath -->
    <path d="M 145 388
             Q 256 348 367 388
             Q 256 358 145 388 Z"
          fill="url(#auraArchGrad)" />
  </g>
</svg>
