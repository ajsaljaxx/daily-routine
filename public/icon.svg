<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020202" />
      <stop offset="100%" stop-color="#141c24" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#B2D5E5" />
      <stop offset="100%" stop-color="#3A92D8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="rgba(178, 213, 229, 0.3)" stroke-width="8" />
  
  <!-- Subtle circular aura rings -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#B2D5E5" stroke-width="2" stroke-dasharray="6 8" opacity="0.4" />
  <circle cx="256" cy="256" r="130" fill="none" stroke="#3A92D8" stroke-width="3" opacity="0.3" />
  
  <!-- Central Sparkle / Star Emblem -->
  <path d="M 256 100 Q 256 256 100 256 Q 256 256 256 412 Q 256 256 412 256 Q 256 256 256 100 Z" fill="url(#glowGrad)" filter="url(#glow)" />
  
  <!-- Mini Accompanying Star -->
  <path d="M 370 140 Q 370 180 330 180 Q 370 180 370 220 Q 370 180 410 180 Q 370 180 370 140 Z" fill="#FFFFFF" opacity="0.9" />
</svg>
